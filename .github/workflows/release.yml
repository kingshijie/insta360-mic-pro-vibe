name: Publish macOS release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Build and verify universal App
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          test "$RELEASE_TAG" = "v$version"
          ./build.zsh --build-only
          app="build/Mic Pro 听写.app"
          codesign --verify --strict "$app"
          lipo "$app/Contents/MacOS/MC110Dictation" -verify_arch arm64 x86_64
          ditto -c -k --keepParent "$app" build/MicPro-Doubao-macOS-universal.zip
          cd build
          shasum -a 256 MicPro-Doubao-macOS-universal.zip > SHA256SUMS.txt

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          [简体中文]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/releases.zh-CN.md)

          Turn the Insta360 Mic Pro power button into a Doubao dictation shortcut. Tap once to start, then tap again to stop.

          - The app starts in English. Switch to Simplified Chinese in **Settings → Language**.
          - After stopping dictation and waiting for text to appear, double-press the power button within 20 seconds to send Return. This setting is enabled by default and can be turned off in Settings. Double-pressing also toggles the transmitter's noise reduction.

          Download **MicPro-Doubao-macOS-universal.zip** from Assets below. Unzip it and drag the app into Applications. Requires macOS 13 or later on Apple silicon or Intel.

          Install Doubao Input Method and BlackHole 2ch, pair the Mic Pro over Bluetooth, and enable Accessibility access for the app. In Doubao, set the hands-free shortcut to Right Option (⌥) and the microphone to Automatic.

          This build is not notarized by Apple. If macOS blocks the first launch, use Open Anyway for this app under System Settings → Privacy & Security.

          [Installation and troubleshooting]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY#installation)
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --title "Vibe Mic Pro $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            build/MicPro-Doubao-macOS-universal.zip build/SHA256SUMS.txt
